<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>My Web Page</title>
    <link rel="icon" type="image/png" href="./img/logo.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section>
        <div class="headerSection">
            <header>
                <div class="logo">
                    <img src="./img/logo.png" alt="logo">
                </div>
            </header>
            <div class="navdiv">
                <nav>
                    <a href="#">Home</a>|
                    <a href="#">About</a>|
                    <a href="#">Contact</a>|
                </nav>

            </div>

        </div>
    </section>
    <article class="articleSection">
        <h2>HTML5 Article</h2>
        <p>This is a practice file for HTML5 for article</p>
    </article>
    <section>
        <main class="mainSection">
            <div>
                <p>This is the main content area.</p>
                <figure>
                    <img src="./img/onnorokom.png" alt="imageOnnoRokom" width="500" height="400">
                    <figcaption>OnnoRokom Software Ltd.</figcaption>
                </figure>

            </div>
            <div class = "regDiv">
                <h2>Registration Form</h2>
                <form class="regForm">
                    <label for="fname">First Name:</label>
                    <input type="text" id="fname" name="fname"><br>
                    <label for="lname">Last Name:</label>
                    <input type="text" id="lname" name="lname"><br>
                    <label for="division">Choose your Division:</label><br>
                    <select id="division" name="division">
                        <option value="Dhaka">Dhaka</option>
                        <option value="Chittagong">Chittagong</option>
                        <option value="Khulna">Khulna</option>
                        <option value="Barisal">Barisal</option>
                        <option value="Sylhet">Sylhet</option>
                        <option value="Rangpur">Rangpur</option>
                        <option value="Mymensingh">Mymensingh</option>
                    </select><br>

                    <label for="subject">Choose your Subject:</label><br>
                    <input type="radio" id="Science" name="subject" value="Science">
                    <label for="Science">Science</label>
                    <input type="radio" id="Commerce" name="subject" value="Commerce">
                    <label for="Commerce">Commerce</label>
                    <input type="radio" id="Arts" name="subject" value="Arts">
                    <label for="Arts">Arts</label> <br>
                    <input type="submit" value="Submit">


                </form>
            </div>

        </main>
    </section>
    <section>
        <aside>
            <p>This is an aside content area.</p>
        </aside>
    </section>
    <section>
        <div>
            <footer>
                <p> <a href="mailto:example@gmail.com">Contact Us</a></p>
            </footer>

        </div>

    </section>
</body>

</html>
